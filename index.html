<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khojo — AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --bg: #ffffff;
      --sidebar: #f5f5f5;
      --text: #202124;
      --muted: #777;
      --border: #e5e5e5;
      --input: #f4f4f4;
      --accent: #6c63ff;
    }

    body.dark {
      --bg: #111111;
      --sidebar: #181818;
      --text: #eeeeee;
      --muted: #999;
      --border: #2d2d2d;
      --input: #222222;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- SIDEBAR ---------- */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 260px;
      background: var(--sidebar);
      padding: 18px;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 30px;
      padding-left: 8px;
      color: var(--accent);
    }

    .new-chat {
      border: none;
      background: var(--bg);
      color: var(--text);
      border-radius: 14px;
      padding: 13px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .new-chat:hover {
      background: var(--input);
    }

    .history-title {
      font-size: 12px;
      color: var(--muted);
      margin: 5px 8px 10px;
      text-transform: uppercase;
    }

    .history {
      overflow-y: auto;
    }

    .history-item {
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--input);
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .theme-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .theme-btn:hover {
      background: var(--input);
    }

    /* ---------- MAIN ---------- */

    .main {
      margin-left: 260px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 600;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 25px;
      margin-right: 15px;
      cursor: pointer;
    }

    /* ---------- CHAT ---------- */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 45px 20px 150px;
    }

    .welcome {
      max-width: 800px;
      margin: 70px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 48px;
      margin-bottom: 15px;
      background: linear-gradient(
        90deg,
        #6c63ff,
        #9b59ff,
        #3f8cff
      );
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: var(--muted);
      font-size: 17px;
    }

    .message-container {
      max-width: 850px;
      margin: auto;
    }

    .message {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: bold;
    }

    .user-avatar {
      background: #444;
      color: white;
    }

    .ai-avatar {
      background: linear-gradient(135deg, #6c63ff, #9b59ff);
      color: white;
    }

    .message-content {
      max-width: 750px;
      white-space: pre-wrap;
    }

    /* ---------- INPUT ---------- */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 30%
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      max-height: 130px;
      padding: 9px 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    .send-btn {
      background: var(--accent);
      color: white;
    }

    .send-btn:hover {
      background: #554cf0;
      color: white;
    }

    .disclaimer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }

    #fileInput {
      display: none;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 700px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
      }

      .menu-btn {
        display: block;
      }

      .input-area {
        left: 0;
      }

      .welcome h1 {
        font-size: 38px;
      }

      .chat {
        padding-top: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      khojo.
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="history-title">
      Recent chats
    </div>

    <div class="history" id="history">
    </div>

    <div class="sidebar-bottom">
      <button class="theme-btn" onclick="toggleTheme()">
        ◐ Change theme
      </button>
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="topbar-title">
        Khojo AI
      </div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>What do you want to khojo?</h1>

        <p>
          Ask anything. Learn, explore, create.
        </p>

      </div>

      <div class="message-container" id="messages">
      </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <input
          type="file"
          id="fileInput"
          onchange="handleFile(event)"
        >

        <button
          class="icon-btn"
          onclick="document.getElementById('fileInput').click()"
          title="Upload file"
        >
          📎
        </button>

        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask Khojo anything..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="icon-btn"
          title="Voice input"
          onclick="voiceInput()"
        >
          🎙
        </button>

        <button
          class="icon-btn send-btn"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

      <div class="disclaimer">
        Khojo can make mistakes. Check important information.
      </div>

    </div>

  </main>


<script>

  let chats = [];

  const promptBox = document.getElementById("prompt");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const history = document.getElementById("history");


  /* ---------- SEND MESSAGE ---------- */

  function sendMessage() {

    const text = promptBox.value.trim();

    if (!text) return;

    welcome.style.display = "none";

    addMessage(text, "user");

    promptBox.value = "";

    addHistory(text);

   // Send message to Khojo backend
fetch("https://khojo-backend.vercel.app/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    message: text
  })
})
.then(response => response.json())
.then(data => {
  if (data.answer) {
    addMessage(data.answer, "ai");
  } else {
    addMessage("Sorry, I couldn't get an answer.", "ai");
  }
})
.catch(error => {
  console.error(error);
  addMessage("Sorry, something went wrong connecting to Khojo.", "ai");
});

  }


  /* ---------- ADD MESSAGE ---------- */

  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message";

    const avatar = document.createElement("div");

    avatar.className =
      "avatar " +
      (type === "user"
        ? "user-avatar"
        : "ai-avatar");

    avatar.textContent =
      type === "user"
        ? "You"
        : "K";


    const content = document.createElement("div");

    content.className = "message-content";

    content.textContent = text;


    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;

  }


  /* ---------- HISTORY ---------- */

  function addHistory(text) {

    chats.unshift(text);

    if (chats.length > 10) {
      chats.pop();
    }

    renderHistory();

  }


  function renderHistory() {

    history.innerHTML = "";

    chats.forEach(chat => {

      const item = document.createElement("div");

      item.className = "history-item";

      item.textContent = chat;

      history.appendChild(item);

    });

  }


  /* ---------- NEW CHAT ---------- */

  function newChat() {

    messages.innerHTML = "";

    welcome.style.display = "block";

    promptBox.value = "";

  }


  /* ---------- DARK MODE ---------- */

  function toggleTheme() {

    document.body.classList.toggle("dark");

  }


  /* ---------- MOBILE SIDEBAR ---------- */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  }


  /* ---------- ENTER KEY ---------- */

  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }


  /* ---------- FILE UPLOAD ---------- */

  function handleFile(event) {

    const file = event.target.files[0];

    if (!file) return;

    addMessage(
      "Uploaded file: " + file.name,
      "user"
    );

  }


  /* ---------- VOICE ---------- */

  function voiceInput() {

    if (!("webkitSpeechRecognition" in window)) {

      alert(
        "Voice recognition is not supported in this browser."
      );

      return;

    }

    const recognition =
      new webkitSpeechRecognition();

    recognition.lang = "en-IN";

    recognition.start();

    recognition.onresult = function(event) {

      promptBox.value =
        event.results[0][0].transcript;

    };

  }

</script>
<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  async function loadAI() {
    try {
      console.log("Loading Khojo AI...");

      const engine = await webllm.CreateMLCEngine(
        "Llama-3.2-1B-Instruct-q4f16_1-MLC",
        {
          initProgressCallback: (progress) => {
            console.log(progress.text);
          }
        }
      );

      window.khojoEngine = engine;

      console.log("Khojo AI is ready!");
    } catch (error) {
      console.error("Khojo AI failed to load:", error);
    }
  }

  loadAI();
</script>

</body>
</html>
